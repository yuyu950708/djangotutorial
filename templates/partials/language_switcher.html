{% load i18n %}
{% get_current_language as CURRENT_LANGUAGE %}
<form action="{% url 'set_language' %}" method="post" class="inline-flex items-center rounded-lg border border-slate-200 bg-white p-0.5 text-xs font-semibold shadow-sm">
  {% csrf_token %}
  <input name="next" type="hidden" value="{{ request.get_full_path }}">
  <button
    type="submit"
    name="language"
    value="zh-hant"
    class="rounded-md px-2.5 py-1.5 transition {% if CURRENT_LANGUAGE == 'zh-hant' %}bg-brand-teal text-white{% else %}text-slate-600 hover:bg-slate-50{% endif %}"
    aria-pressed="{% if CURRENT_LANGUAGE == 'zh-hant' %}true{% else %}false{% endif %}"
  >
    繁中
  </button>
  <button
    type="submit"
    name="language"
    value="en"
    class="rounded-md px-2.5 py-1.5 transition {% if CURRENT_LANGUAGE == 'en' %}bg-brand-teal text-white{% else %}text-slate-600 hover:bg-slate-50{% endif %}"
    aria-pressed="{% if CURRENT_LANGUAGE == 'en' %}true{% else %}false{% endif %}"
  >
    EN
  </button>
</form>
